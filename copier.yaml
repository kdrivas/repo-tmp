_templates_suffix: ".jinja"
_answers_file: .copier-answers.yml

# Files the user owns — never overwritten on `copier update`
_skip_if_exists:
  - "{{ package_name }}/**"
  - "tests/**"
  - "pipelines/**"
  - "pyproject.toml"
  - "README.md"
  - ".env.example"
  - ".python-version"
  - ".secrets.baseline"
  - ".copier-answers.yml"

package_name:
  type: str
  help: "Python package name (replaces 'src' — used as directory name and in imports)"
  placeholder: my_pipeline
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Package name must start with a lowercase letter and contain only lowercase letters, digits, and underscores.
    {% endif %}

project_description:
  type: str
  help: Short description of the project
  default: A machine learning pipeline project

author_name:
  type: str
  help: Author full name
  default: John Doe

author_email:
  type: str
  help: Author email address
  default: john.doe@example.com

python_version:
  type: str
  help: Python version to use
  choices:
    - "3.12"
    - "3.13"
  default: "3.12"
