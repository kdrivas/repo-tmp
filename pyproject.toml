[project]
name = "src"
version = "0.1.0"
description = "description"
authors = [{ name = "Paccar", email = "hello@paccar.com" }]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "flytekit>=1.16.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    # "mlops-lib==0.5.0",  # Comentado temporalmente para usar versión local
    "mlops-lib",  # Usando versión local (ver [tool.uv.sources])
]

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "docstr-coverage>=2.3.2",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pre-commit>=4.5.1",
    "detect-secrets>=1.5.0",
    "memray>=1.19.2",
    "pyinstrument>=5.1.2",
]
cicd = ["basedpyright>=1.38.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# [[tool.uv.index]]  # Comentado temporalmente para usar versión local
# name = "mlops-lib"
# url = "https://us-central1-python.pkg.dev/itd-968-np-mlops-observability/mlops-lib/simple/"
# explicit = true

[tool.uv.sources]
# mlops-lib = { index = "mlops-lib" }  # Comentado temporalmente
mlops-lib = { path = "../aacoe/aacoe-mlops-observability-lib", editable = true }  # Versión local temporal
